          if (rng() < state.density * (1 - row * 0.13)) {
            city.push({
              arch: arch,
              b: b,
              side: side,
              row: row,
              lateral: lateral + rng() * 14,
              z0: z
            });
          }

          z += b.d + 8 + rng() * 34;      // the gap between blocks is the street
        }
      }
    }
  }

  function seedFloats() {
    const kind = find(window.FLOATS, state.float);
    const rng = Math.random;
    floats = [];
    for (let z = 40; z < FOG; z += 34 + rng() * 40) {
      const f = kind.make(rng);
      f.kind = kind;
      f.x = (Math.random() - 0.5) * 260;
      f.y = 62 + Math.random() * 74;
      f.z = z;
      f.phase = Math.random() * 6.28;
      floats.push(f);
    }
  }

  /* ---------- Sizing ---------- */

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    width = innerWidth;
    height = innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = width / 2;
    cy = height / 2;

    // The lens is set across the width, then held wide enough on a tall
    // phone frame that the towers do not stretch.
    focal = (width / 2) / Math.tan((FOV * Math.PI / 180) / 2);
    if (height > width) focal = Math.max(focal, (height / 2) / Math.tan((112 * Math.PI / 180) / 2));

    horizon = cy - Math.tan(PITCH) * focal;
    g.focal = focal;
    g.width = width;
    g.height = height;
  }

  /* ---------- The frame ---------- */

  function draw(dt) {
    time += dt;
    const pal = palette();
    const move = state.speed * dt;

    g.detail = state.detail;
    g.inks = pal.inks;

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#020306";
    ctx.fillRect(0, 0, width, height);

    // --- behind everything ---
    ctx.strokeStyle = pal.inks[1];
    ctx.fillStyle = pal.inks[1];
    ctx.shadowBlur = 0;
    find(window.SKIES, state.sky).draw(g, horizon, time);
    ctx.globalAlpha = 1;

    ctx.lineWidth = 1;
    ctx.shadowBlur = pal.glow;

    // --- the ground ---
    ctx.strokeStyle = pal.inks[1];
    ctx.shadowColor = pal.inks[1];
    const spacing = 14;
    const roll = (time * state.speed) % spacing;

    ctx.beginPath();
    for (const side of [-1, 1]) seg(P(side * ROAD_HALF, 0, 2), P(side * ROAD_HALF, 0, FOG));
    fade(2, 0.75);
    ctx.stroke();

    for (let z = 2 + roll; z < FOG; z += spacing) {
      ctx.beginPath();
      seg(P(-ROAD_HALF, 0, z), P(ROAD_HALF, 0, z));
      fade(z, 0.45);
      ctx.stroke();
    }

    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    ctx.lineTo(width, horizon);
    ctx.stroke();

    // --- the city, far to near ---
    ctx.strokeStyle = pal.inks[0];
    ctx.shadowColor = pal.inks[0];
    city.sort(function (a, b) { return b.z0 - a.z0; });

    for (const item of city) {
      item.z0 -= move;
      if (item.z0 + item.b.d < 1.5) {
        // Rebuilt at the back of the world, so the drive never ends.
        const set = skylineSet();
        item.arch = set[Math.floor(Math.random() * set.length)];
        item.b = item.arch.make(Math.random);
        item.b.h *= 0.75 + item.row * 0.16;
        item.z0 = FOG + Math.random() * 40;
        continue;
      }
      // Rows behind the front one draw quieter, so the city has depth.
      g.detail = state.detail * (1 - item.row * 0.18);
      const x0 = item.side > 0 ? item.lateral : -(item.lateral + item.b.w);
      item.arch.draw(g, item.b, x0, item.z0);
    }

    // --- signs hanging over the city ---
    for (const f of floats) {
      f.z -= move;
      if (f.z < 4) { f.z = FOG + Math.random() * 30; f.x = (Math.random() - 0.5) * 260; }
      f.kind.draw(g, f, time);
    }

    // --- the voice ---
    ctx.globalAlpha = 1;
    const anchor = P(0, VOICE_Y, VOICE_Z);
    if (anchor) {
      const r = (VOICE_R * focal) / anchor[2];
      ctx.save();
      ctx.translate(anchor[0], anchor[1]);
      ctx.strokeStyle = pal.inks[1];
      ctx.fillStyle = pal.inks[1];
      ctx.shadowColor = pal.inks[1];
      ctx.shadowBlur = pal.glow + 12;
      ctx.lineWidth = 1.2;
      find(window.VOICES, state.voice).draw(ctx, r, time, state.amp, pal.inks);
      ctx.restore();
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  /* ---------- Controls ---------- */

  const PRESETS = [
    { id: "tokyo",   name: "Neon Tokyo",    state: { palette: "shinjuku-crossing", sky: "haze-band",   voice: "orbit",       float: "torii",     skyline: "towers",    speed: 30, density: 1.1,  detail: 0.6,  amp: 0.35 } },
    { id: "ghost",   name: "Ghost teal",    state: { palette: "sector-indigo",     sky: "clear-night", voice: "waveform",    float: "sign-rod",  skyline: "needles",   speed: 24, density: 0.7,  detail: 0.5,  amp: 0.5 } },
    { id: "sundown", name: "Sundown",       state: { palette: "ginza-gold",        sky: "sun-bands",   voice: "orbit",       float: "ring",      skyline: "low",       speed: 34, density: 0.8,  detail: 0.55, amp: 0.3 } },
    { id: "house",   name: "House colours", state: { palette: "vermilion-signal",  sky: "haze-band",   voice: "orbit",       float: "billboard", skyline: "mixed",     speed: 26, density: 0.9,  detail: 0.6,  amp: 0.3 } },
    { id: "print",   name: "White print",   state: { palette: "broadsheet",        sky: "clear-night", voice: "polyhedron",  float: "torii",     skyline: "exotic",    speed: 20, density: 1,    detail: 0.85, amp: 0.2 } },
    { id: "empty",   name: "Nearly empty",  state: { palette: "ice-lantern",       sky: "star-field",  voice: "waveform",    float: "drone",     skyline: "monoliths", speed: 18, density: 0.35, detail: 0.4,  amp: 0.15 } },
    { id: "planet",  name: "Low planet",    state: { palette: "harbour-fog",       sky: "low-planet",  voice: "spectrum-ring", float: "blimp",   skyline: "monoliths", speed: 22, density: 0.6,  detail: 0.5,  amp: 0.4 } },
    { id: "mega",    name: "Megastructure", state: { palette: "jade-circuit",      sky: "megastructure", voice: "gyroscope", float: "glyph",     skyline: "exotic",    speed: 28, density: 1.2,  detail: 0.7,  amp: 0.3 } }
  ];

  function options(list) {
    return list.map(function (item) { return { id: item.id, name: item.name }; });
  }

  /* Anything that changes what exists in the world rebuilds it.
     Anything that only changes how it looks does not. */
  function apply(next) {
    const rebuildCity = next.skyline !== state.skyline || next.density !== state.density;
    const rebuildFloats = next.float !== state.float;
    Object.assign(state, next);
    document.documentElement.style.setProperty("--accent", palette().inks[0]);
    if (rebuildCity) seedCity();
    if (rebuildFloats) seedFloats();
    if (CALM) draw(0);
  }

  /* ---------- Go ---------- */

  resize();
  addEventListener("resize", function () { resize(); if (CALM) draw(0); });

  seedCity();
  seedFloats();
  document.documentElement.style.setProperty("--accent", palette().inks[0]);

  const strip = window.buildStrip({
    mount: document.body,
    groups: [
      { key: "palette", label: "Colour", items: options(window.PALETTES) },
      { key: "sky", label: "Sky", items: options(window.SKIES) },
      { key: "voice", label: "Voice", items: options(window.VOICES) },
      { key: "float", label: "Sky objects", items: options(window.FLOATS) },
      { key: "skyline", label: "Skyline", items: options(SKYLINES) }
    ],
    sliders: [
      { key: "speed", label: "Speed", min: 0, max: 80, step: 1, value: state.speed },
      { key: "density", label: "Density", min: 0.2, max: 2, step: 0.05, value: state.density },
      { key: "detail", label: "Detail", min: 0, max: 1, step: 0.05, value: state.detail },
      { key: "amp", label: "Voice level", min: 0, max: 1, step: 0.01, value: state.amp }
    ],
    presets: PRESETS,
    onChange: apply
  });

  // The strip starts on its first preset, and the core follows it, so the
  // dropdowns can never disagree with what is on screen.
  strip.setState(PRESETS[0].state);

  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    draw(dt);
    requestAnimationFrame(frame);
  }

  if (CALM) draw(0); else requestAnimationFrame(frame);

})();

</script>

</body>
</html>
